name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-import:
    name: Lint & Import Check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pyqt5 pulseaudio-utils libportaudio2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile audio_detector_gui.py

      - name: Syntax check (modules)
        run: |
          python -m py_compile modern_widgets.py
          python -m py_compile styles.py
          python -m py_compile build.py

      - name: Import check
        if: runner.os == 'Linux'
        run: |
          export QT_QPA_PLATFORM=offscreen
          python -c "
          import audio_detector_gui
          import modern_widgets
          import styles
          print('All imports OK')
          "

  build:
    name: Build Executable
    needs: lint-and-import
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pyqt5 pulseaudio-utils libportaudio2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: python build.py

      - name: Verify binary exists
        run: test -f dist/AudioQuestionDetector

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioQuestionDetector-linux
          path: dist/AudioQuestionDetector
